<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Presidential Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="banner" role="alert">Private administrative application — Cloudflare Access and server authorization required. Not approved for deployment.</div>
<header class="top">
  <h1>Recovery Forward Foundation <span>Presidential Dashboard</span></h1>
  <nav id="nav" aria-label="Sections">
    <button data-s="overview" class="on">Overview</button>
    <button data-s="proposals">Proposals</button>
    <button data-s="meetings">Meetings</button>
    <button data-s="calendar">Calendar</button>
    <button data-s="members">Board Members</button>
    <button data-s="applications">Applications</button>
    <button data-s="registry">Grants</button>
    <button data-s="finance">Finance</button>
    <button data-s="comms">Communications</button>
    <button data-s="documents">Documents</button>
    <button data-s="security">Security</button>
    <button data-s="board" hidden>Board access</button>
    <button data-s="audit" hidden>Audit activity</button>
  </nav>
  <button id="logout" class="btn" type="button" hidden>Sign out</button>
</header>
<main id="main" aria-live="polite"></main>
<script src="app.js"></script>
</body>
</html>
