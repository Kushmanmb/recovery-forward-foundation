name = "recovery-forward-control-center"
main = "src/worker.js"
compatibility_date = "2026-10-16"
workers_dev = false

# ACCESS_AUD, ACCESS_TEAM_DOMAIN and PRESIDENT_EMAIL are managed in Cloudflare
# (dashboard/secrets). They are intentionally not declared here; keep_vars stops
# deploys from overwriting them.
keep_vars = true

routes = [
  { pattern = "admin.recoveryforwardfoundation.org", custom_domain = true }
]

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[[d1_databases]]
binding = "DB"
database_name = "recovery-forward-control-center-db"
database_id = "3c02163b-1451-4221-b49c-73b4c908dda7"
migrations_dir = "migrations"

[assets]
directory = "../admin-prototype"
binding = "ASSETS"
run_worker_first = true
